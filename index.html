<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Workshop Digital - ETEC Sebrae</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Bem-vindo ao Workshop Digital</h1>
        <h2>Conheça algumas das mídias produzidas para a ETEC Sebrae</h2>
    </header>

    <main>
        <section class="imagens">

            <figure>
                <img
                    src="imagens/post dia das mães.png"
                    alt="Post do Dia das Mães"
                    loading="lazy"
                >
                <figcaption>Post do Dia das Mães</figcaption>
            </figure>

            <figure>
                <img
                    src="imagens/Visita Técnica AIG.png"
                    alt="Arte sobre visita técnica"
                    loading="lazy"
                >
                <figcaption>Visita Técnica AIG</figcaption>
            </figure>

            <figure>
                <img
                    src="imagens/Molduras Dia da Familia.png"
                    alt="Molduras do Dia da Família"
                    loading="lazy"
                >
                <figcaption>Moldura do Dia da Família</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>3º Desenvolvimento de Sistemas — ETEC Sebrae</p>
    </footer>

</body>
</html>
